<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 w-full max-w-sm shadow-2xl mx-4">
        <h2 class="text-2xl font-black text-indigo-400 mb-2">Admin Login</h2>
        <p class="text-slate-400 text-sm mb-6">Enter credentials to access the panel.</p>
        
        <div class="space-y-4">
            <input type="text" id="username" placeholder="Username" 
                class="w-full p-4 bg-slate-900 rounded-2xl border border-slate-700 outline-none text-white focus:border-indigo-500 transition-all">
            
            <input type="password" id="password" placeholder="Password" 
                class="w-full p-4 bg-slate-900 rounded-2xl border border-slate-700 outline-none text-white focus:border-indigo-500 transition-all">

            <button onclick="checkLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 p-4 rounded-2xl font-bold transition-all text-white">
                Unlock Panel
            </button>
            
            <p id="loginError" class="text-red-500 text-xs text-center hidden">Incorrect username or password.</p>
        </div>
    </div>

    <script>
        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Simple hardcoded credentials
            if(user === "studiment" && pass === "stud6457") {
                // Optional: Save auth state so Admin.html knows they logged in
                localStorage.setItem('adminAuth', 'true');
                // Redirect to your second file
                window.location.href = "Admin.html";
            } else {
                const err = document.getElementById('loginError');
                err.classList.remove('hidden');
                setTimeout(() => err.classList.add('hidden'), 3000);
            }
        }

        // Allow "Enter" key to submit
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkLogin();
        });
    </script>
</body>
</html>
