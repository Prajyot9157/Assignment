<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MHT CET | Admin Portal</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appBg: '#090a10',
                        appCard: '#15161e',
                        appPink: '#f43f5e',
                        textMuted: '#8b8d9c'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body { background-color: #090a10; color: #fff; margin: 0; padding: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .admin-input { width: 100%; background: #1a1b26; border: 1px solid #2d2e3d; border-radius: 0.75rem; padding: 0.875rem; color: white; font-size: 0.875rem; outline: none; transition: all 0.2s; }
        .admin-input:focus { border-color: #f43f5e; box-shadow: 0 0 0 2px rgba(244, 63, 94, 0.2); }
        select.admin-input { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b8d9c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="p-5 flex justify-between items-center bg-appCard border-b border-gray-800 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-appPink/20 flex items-center justify-center text-appPink border border-appPink/30">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold leading-tight">Admin Portal</h1>
                <p class="text-[10px] text-textMuted">Manage App Content</p>
            </div>
        </div>
        <button onclick="openUploadModal()" class="px-4 py-2 bg-appPink text-white text-sm font-bold rounded-lg shadow-md shadow-appPink/20 flex items-center gap-2">
            <i class="fa-solid fa-plus"></i> Add Item
        </button>
    </header>

    <!-- Main Content List -->
    <main class="flex-1 overflow-y-auto hide-scrollbar p-5 space-y-4" id="admin-list">
        <!-- Loader -->
        <div class="text-center py-10 text-textMuted">
            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-appPink"></i>
            <p>Loading server data...</p>
        </div>
    </main>

    <!-- Admin Upload Modal -->
    <div id="modal-upload" class="hidden absolute inset-0 z-50 flex items-end sm:items-center justify-center bg-black/80 backdrop-blur-sm transition-opacity p-2 sm:p-0">
        <div class="bg-appCard w-full sm:max-w-md sm:rounded-3xl rounded-3xl p-6 shadow-2xl border border-gray-800 fade-in max-h-[95dvh] overflow-y-auto hide-scrollbar">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-white">Add New Content</h3>
                <button onclick="closeUploadModal()" class="text-textMuted hover:text-white w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="upload-form" onsubmit="handleUpload(event)" class="space-y-4">
                
                <div>
                    <label class="block text-xs text-textMuted mb-1 ml-1">Category (Where should it appear?)</label>
                    <select id="up-category" class="admin-input" required>
                        <option value="notes">Notes</option>
                        <option value="live">Live Classes</option>
                        <option value="tests">Mock Tests</option>
                        <option value="pyq">PYQ Bank</option>
                        <option value="practice">Practice Sets</option>
                        <option value="formula">Formula Sheet</option>
                        <option value="mindmaps">Mind Maps</option>
                        <option value="dpps">DPPs</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-textMuted mb-1 ml-1">Subject</label>
                    <select id="up-subject" class="admin-input" required>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Biology">Biology</option>
                        <option value="Inorganic Chemistry">Inorganic Chemistry</option>
                        <option value="Organic Chemistry">Organic Chemistry</option>
                        <option value="Full Syllabus">Full Syllabus / General</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-xs text-textMuted mb-1 ml-1">Title / Topic Name</label>
                    <input type="text" id="up-topic" placeholder="e.g. Thermodynamics L-1 or Test 1" class="admin-input" required>
                </div>
                
                <div class="flex gap-3">
                    <div class="w-1/2">
                        <label class="block text-xs text-textMuted mb-1 ml-1">Meta Info (Optional)</label>
                        <input type="text" id="up-size" placeholder="e.g. 1.5 MB or 120 Mins" class="admin-input">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs text-textMuted mb-1 ml-1">Link (URL / Code)</label>
                        <input type="text" id="up-code" placeholder="File URL or Video Link" class="admin-input" required>
                    </div>
                </div>

                <button type="submit" class="w-full mt-4 bg-appPink text-white font-bold py-3.5 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Upload to Server
                </button>
            </form>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div id="modal-delete" class="hidden absolute inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-sm px-5">
        <div class="bg-appCard w-full max-w-sm rounded-3xl p-6 text-center border border-gray-800 shadow-2xl fade-in">
            <div class="w-16 h-16 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500 text-2xl">
                <i class="fa-solid fa-trash"></i>
            </div>
            <h3 class="text-xl font-bold text-white mb-2">Delete Item?</h3>
            <p class="text-textMuted text-sm mb-6">This action cannot be undone and will remove it from the student app immediately.</p>
            <div class="flex gap-3">
                <button onclick="closeDeleteModal()" class="flex-1 py-3 bg-gray-800 rounded-xl text-white font-medium">Cancel</button>
                <button id="btn-confirm-del" class="flex-1 py-3 bg-red-500 rounded-xl text-white font-medium shadow-lg shadow-red-500/20">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="absolute top-4 left-1/2 -translate-x-1/2 z-[100] px-4 py-2.5 rounded-full bg-appCard border border-gray-700 shadow-2xl text-sm font-medium text-white flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <i class="fa-solid fa-circle-check text-appPink" id="toast-icon"></i>
        <span id="toast-msg">Success</span>
    </div>

    <script>
        // --- FIREBASE SETUP ---
        const firebaseConfig = {
            apiKey: "AIzaSyCpG-jibUuhZbqzqHCDR7PeSOddxoNF4sg",
            authDomain: "studiment-tracking.firebaseapp.com",
            databaseURL: "https://studiment-tracking-default-rtdb.firebaseio.com",
            projectId: "studiment-tracking"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const refMaterials = db.ref('study_text_entries');

        let allData = [];
        let pendingDeleteId = null;

        const categoryLabels = {
            "notes": "Notes", "live": "Live Class", "tests": "Mock Test", 
            "pyq": "PYQ Bank", "practice": "Practice", "formula": "Formula", 
            "mindmaps": "Mind Map", "dpps": "DPP"
        };

        // --- FETCH DATA ---
        refMaterials.on('value', snap => {
            const data = snap.val() || {};
            allData = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            allData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            renderAdminList();
        });

        // --- RENDER LIST ---
        const renderAdminList = () => {
            const container = document.getElementById('admin-list');
            if (allData.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-textMuted"><i class="fa-solid fa-box-open text-3xl mb-3"></i><p>Server is empty. Add items to see them here.</p></div>`;
                return;
            }

            container.innerHTML = allData.map(item => `
                <div class="bg-appCard border border-gray-800 rounded-xl p-4 flex items-center gap-4">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[9px] uppercase tracking-wider font-bold text-white bg-appPink px-2 py-0.5 rounded">${categoryLabels[item.category] || 'Notes'}</span>
                            <span class="text-[10px] text-gray-400">${escapeHtml(item.subject)}</span>
                        </div>
                        <h4 class="text-sm font-bold text-white truncate">${escapeHtml(item.topic)}</h4>
                        <div class="text-[10px] text-textMuted mt-1 truncate">Link: ${escapeHtml(item.code)}</div>
                    </div>
                    <button onclick="confirmDelete('${item.id}')" class="w-10 h-10 shrink-0 bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white rounded-lg transition-colors flex items-center justify-center">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `).join('');
        };

        // --- UPLOAD LOGIC ---
        const openUploadModal = () => document.getElementById('modal-upload').classList.remove('hidden');
        const closeUploadModal = () => {
            document.getElementById('modal-upload').classList.add('hidden');
            document.getElementById('upload-form').reset();
        };

        const handleUpload = async (e) => {
            e.preventDefault();
            const category = document.getElementById('up-category').value;
            const subject = document.getElementById('up-subject').value;
            const topic = document.getElementById('up-topic').value.trim();
            const size = document.getElementById('up-size').value.trim();
            const code = document.getElementById('up-code').value.trim();

            const btn = e.target.querySelector('button');
            const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading...';
            btn.disabled = true;

            try {
                await refMaterials.push({ 
                    category, subject, topic, size, code, 
                    timestamp: Date.now() 
                });
                closeUploadModal();
                showToast("Content added successfully");
            } catch(err) {
                showToast("Failed to upload content", true);
            } finally {
                btn.innerHTML = originalBtnHtml;
                btn.disabled = false;
            }
        };

        // --- DELETE LOGIC ---
        const confirmDelete = (id) => {
            pendingDeleteId = id;
            document.getElementById('modal-delete').classList.remove('hidden');
        };
        const closeDeleteModal = () => {
            pendingDeleteId = null;
            document.getElementById('modal-delete').classList.add('hidden');
        };
        
        document.getElementById('btn-confirm-del').addEventListener('click', async () => {
            if(!pendingDeleteId) return;
            try {
                await refMaterials.child(pendingDeleteId).remove();
                showToast("Item permanently deleted");
            } catch(e) {
                showToast("Failed to delete item", true);
            }
            closeDeleteModal();
        });

        // --- UTILS ---
        const escapeHtml = (str) => {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[m]));
        };

        const showToast = (msg, isError = false) => {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            
            const icon = document.getElementById('toast-icon');
            icon.className = isError ? 'fa-solid fa-circle-exclamation text-red-500' : 'fa-solid fa-circle-check text-appPink';

            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, 0)';
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -20px)';
            }, 3000);
        };
    </script>
</body>
</html>
