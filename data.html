<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Studiment </title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --primary: #6366f1;
            --secondary: #0ea5e9;
            --accent: #f43f5e;
            --success: #10b981;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: 1px solid rgba(255,255,255,0.08);
            --card-hover: rgba(255,255,255,0.03);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg-dark);
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(99,102,241,0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(14,165,233,0.1) 0%, transparent 40%);
            min-height: 100vh;
        }

        /* --- Layout & Typography --- */
        .admin-container {
            width: 95%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 0 60px 0;
        }

        h1, h2, h3 { margin: 0; }

        /* --- Header --- */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo { 
            font-size: 1.5rem; 
            font-weight: 700; 
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--secondary), var(--primary)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* --- Buttons --- */
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: white;
            text-decoration: none;
        }

        .btn:active { transform: scale(0.96); }

        .btn-primary { background: var(--primary); }
        .btn-primary:hover { background: #4f46e5; }

        .btn-danger { background: rgba(244, 63, 94, 0.2); color: var(--accent); border: 1px solid rgba(244, 63, 94, 0.3); }
        .btn-danger:hover { background: rgba(244, 63, 94, 0.3); }

        .btn-success { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .btn-success:hover { background: rgba(16, 185, 129, 0.3); }

        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--text-muted); }
        .btn-outline:hover { border-color: var(--text-main); color: var(--text-main); }
        
        .btn-icon { padding: 10px; border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; }

        /* --- Stats Grid --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            border: var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--primary);
        }

        .stat-card:nth-child(2)::after { background: var(--warning); }
        .stat-card:nth-child(3)::after { background: var(--success); }
        .stat-card:nth-child(4)::after { background: var(--accent); }

        .stat-number { font-size: 2.2rem; font-weight: 700; line-height: 1; margin-bottom: 5px; }
        .stat-label { color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }

        /* --- Controls & Filters --- */
        .controls-bar {
            background: var(--glass-bg);
            border: var(--glass-border);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
            align-items: flex-end;
        }

        .filters-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            flex: 1;
        }

        .input-wrapper { display: flex; flex-direction: column; gap: 6px; }
        .input-wrapper label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            outline: none;
            min-width: 160px;
            font-family: inherit;
        }
        .form-control:focus { border-color: var(--primary); }

        .view-toggles {
            display: flex;
            background: rgba(15, 23, 42, 0.6);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .view-btn {
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .view-btn.active {
            background: var(--glass-bg);
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* --- Data Display (Table & Grid) --- */
        .data-container {
            min-height: 400px;
            position: relative;
        }
        
        /* Table View */
        .view-mode-table .applications-list {
            display: table;
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        
        .view-mode-table .app-item {
            display: table-row;
            background: var(--glass-bg);
        }

        .view-mode-table .app-header {
            display: table-header-group;
        }

        .view-mode-table .app-header div {
            display: table-cell;
            padding: 15px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: left;
        }

        .view-mode-table .app-cell {
            display: table-cell;
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            vertical-align: middle;
        }

        /* Grid/Card View (Mobile Style) */
        .view-mode-grid .applications-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .view-mode-grid .app-header { display: none; } /* Hide headers in grid mode */

        .view-mode-grid .app-item {
            display: block;
            background: var(--glass-bg);
            border: var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            transition: transform 0.2s;
        }

        .view-mode-grid .app-item:hover { transform: translateY(-4px); border-color: var(--primary); }

        .view-mode-grid .app-cell {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .view-mode-grid .app-cell:last-child { border-bottom: none; padding-top: 15px; }

        /* Label for Grid View cells */
        .view-mode-grid .app-cell::before {
            content: attr(data-label);
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-right: 10px;
        }
        
        /* Specific Cell Styles */
        .cell-actions { white-space: nowrap; }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-reviewed { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-rejected { background: rgba(244, 63, 94, 0.15); color: var(--accent); border: 1px solid rgba(244, 63, 94, 0.3); }

        /* --- Loading Spinner --- */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .loading-overlay.active { opacity: 1; pointer-events: all; }
        
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Modal --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            opacity: 0; pointer-events: none;
            transition: all 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal {
            background: #1e293b;
            width: 90%; max-width: 650px;
            max-height: 90vh;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-body { padding: 30px; overflow-y: auto; }
        .modal-footer {
            padding: 20px 30px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: flex-end; gap: 10px;
            border-radius: 0 0 20px 20px;
        }

        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .detail-item { margin-bottom: 5px; }
        .detail-item label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 4px; }
        .detail-item p { margin: 0; font-weight: 500; font-size: 1rem; }
        .full-width { grid-column: 1 / -1; }

        /* --- Toast Notifications --- */
        .toast-container {
            position: fixed; bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 2000;
        }
        .toast {
            background: #1e293b;
            border-left: 4px solid var(--primary);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            display: flex; align-items: center; gap: 15px;
            animation: slideIn 0.3s ease;
            max-width: 350px;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* --- Responsive Tweaks --- */
        @media (max-width: 768px) {
            .admin-header { flex-direction: column; align-items: flex-start; }
            .header-controls { width: 100%; justify-content: space-between; }
            .detail-grid { grid-template-columns: 1fr; }
            
            /* Hide the table view on mobile by default if needed, 
               but our JS will handle the switch to 'grid' mode automatically */
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <header class="admin-header">
            <div class="logo">
                <i class="fas fa-layer-group"></i> Studiment <span style="font-size: 0.8rem; opacity: 0.5; font-weight: 400;">| Admin</span>
            </div>
            <div class="header-controls">
                <button class="btn btn-outline" id="refreshBtn">
                    <i class="fas fa-sync-alt"></i> <span class="d-none d-md-inline">Sync</span>
                </button>
                <button class="btn btn-outline" id="refreshBtn">
                    <i class="studiment.live"></i> <span class="d-none d-md-inline">Back To Site</span>
                </button>
                <button class="btn btn-danger" id="logoutBtn" style="padding: 8px 15px;">
                    <i class="fas fa-power-off"></i>
                </button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalApplications">0</div>
                <div class="stat-label">Total Applications</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingApplications">0</div>
                <div class="stat-label">Pending Review</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="reviewedApplications">0</div>
                <div class="stat-label">Reviewed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="rejectedApplications">0</div>
                <div class="stat-label">Rejected</div>
            </div>
        </div>

        <div class="controls-bar">
            <div class="filters-group">
                <div class="input-wrapper">
                    <label>Status</label>
                    <select id="statusFilter" class="form-control">
                        <option value="all">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="reviewed">Reviewed</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
                <div class="input-wrapper">
                    <label>Expertise</label>
                    <select id="expertiseFilter" class="form-control">
                        <option value="all">All Areas</option>
                        <option value="coding">Coding / Tech</option>
                        <option value="research">Thesis / Reports</option>
                        <option value="handwriting">Handwriting</option>
                        <option value="ppt">Presentations</option>
                        <option value="math">Mathematics</option>
                    </select>
                </div>
                <div class="input-wrapper" style="flex-grow: 1;">
                    <label>Search</label>
                    <input type="text" id="searchInput" class="form-control" placeholder="Search by name, email, or college...">
                </div>
            </div>

            <div style="display: flex; gap: 15px; align-items: flex-end;">
                <div class="input-wrapper">
                    <label>View Mode</label>
                    <div class="view-toggles">
                        <button class="view-btn active" id="viewTableBtn" title="Desktop Table View">
                            <i class="fas fa-table"></i> Table
                        </button>
                        <button class="view-btn" id="viewGridBtn" title="Mobile Card View">
                            <i class="fas fa-th-large"></i> Cards
                        </button>
                    </div>
                </div>
                
                <div class="input-wrapper">
                    <label>Export</label>
                    <div style="display: flex; gap: 5px;">
                        <button class="btn btn-outline" id="exportCSV" title="Export CSV" style="padding: 10px;"><i class="fas fa-file-csv"></i></button>
                        <button class="btn btn-outline" id="exportJSON" title="Export JSON" style="padding: 10px;"><i class="fas fa-file-code"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <div id="dataContainer" class="data-container view-mode-table">
            <div class="loading-overlay" id="loadingSpinner">
                <div class="spinner"></div>
            </div>

            <div class="applications-list" id="applicationsList">
                <div class="app-header">
                    <div>Name</div>
                    <div>Email</div>
                    <div>College</div>
                    <div>Expertise</div>
                    <div>Status</div>
                    <div>Date</div>
                    <div>Actions</div>
                </div>
                </div>
        </div>
    </div>

    <div class="modal-overlay" id="applicationModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-user-circle"></i> Application Details</h3>
                <button class="btn-outline btn-icon" id="closeModal" style="border:none;"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="detail-grid" id="modalContent">
                    </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" id="rejectBtn">Reject</button>
                <button class="btn btn-success" id="approveBtn">Mark Reviewed</button>
                <button class="btn btn-primary" id="emailBtn"><i class="fas fa-envelope"></i> Email</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
        import { getDatabase, ref, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

        // Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBgo3Ok300QkkHOXdJyEs6HujupcBRrNbA",
            authDomain: "assignment-242bc.firebaseapp.com",
            databaseURL: "https://assignment-242bc-default-rtdb.firebaseio.com",
            projectId: "assignment-242bc",
            storageBucket: "assignment-242bc.firebasestorage.app",
            messagingSenderId: "117578871190",
            appId: "1:117578871190:web:957d815aadbf7b298e6db7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const appsRef = ref(db, "writer-applications");

        // State
        let allApplications = [];
        let currentId = null;

        // UI References
        const container = document.getElementById('dataContainer');
        const listEl = document.getElementById('applicationsList');
        const modal = document.getElementById('applicationModal');
        const spinner = document.getElementById('loadingSpinner');
        
        // --- Initialization ---
        
        function init() {
            setLoading(true);
            
            // Check screen size for initial view mode
            if (window.innerWidth < 768) {
                switchView('grid');
            }

            // Real-time Listener
            onValue(appsRef, (snapshot) => {
                const data = snapshot.val();
                allApplications = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        allApplications.push({ id: key, ...data[key] });
                    });
                    // Sort by newest first
                    allApplications.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                }
                
                updateStats();
                renderData();
                setLoading(false);
            }, (error) => {
                showToast(`Error: ${error.message}`, 'error');
                setLoading(false);
            });
        }

        // --- Rendering ---

        function renderData() {
            // Get filters
            const statusFn = document.getElementById('statusFilter').value;
            const expertFn = document.getElementById('expertiseFilter').value;
            const searchFn = document.getElementById('searchInput').value.toLowerCase();

            // Clear list (keep header if in table mode)
            const headerHTML = listEl.querySelector('.app-header').outerHTML;
            listEl.innerHTML = headerHTML;

            const filtered = allApplications.filter(app => {
                const s = app.status || 'pending';
                const e = app.expertise || '';
                
                // Status Match
                if (statusFn !== 'all' && s !== statusFn && !(statusFn === 'pending' && !app.status)) return false;
                // Expertise Match
                if (expertFn !== 'all' && !e.toLowerCase().includes(expertFn)) return false;
                // Search Match
                const txt = (app.fullName + app.email + app.college).toLowerCase();
                if (searchFn && !txt.includes(searchFn)) return false;
                
                return true;
            });

            if (filtered.length === 0) {
                const empty = document.createElement('div');
                empty.style.padding = '40px';
                empty.style.textAlign = 'center';
                empty.style.color = 'var(--text-muted)';
                empty.innerHTML = `<i class="fas fa-inbox fa-3x" style="margin-bottom:15px; opacity:0.5"></i><br>No applications found.`;
                empty.className = 'full-width'; // For grid layout
                listEl.appendChild(empty);
                return;
            }

            filtered.forEach(app => {
                const div = document.createElement('div');
                div.className = 'app-item';
                
                const status = app.status || 'pending';
                const dateStr = app.timestamp ? new Date(app.timestamp).toLocaleDateString() : '-';

                div.innerHTML = `
                    <div class="app-cell" data-label="Name"><strong>${app.fullName || 'Unknown'}</strong></div>
                    <div class="app-cell" data-label="Email">${app.email || '-'}</div>
                    <div class="app-cell" data-label="College">${app.college || '-'}</div>
                    <div class="app-cell" data-label="Expertise">${app.expertise || '-'}</div>
                    <div class="app-cell" data-label="Status">
                        <span class="status-badge status-${status}">${status}</span>
                    </div>
                    <div class="app-cell" data-label="Date">${dateStr}</div>
                    <div class="app-cell cell-actions" data-label="Actions">
                        <button class="btn btn-outline btn-icon" style="width:32px; height:32px; font-size:0.8rem" onclick="window.viewApp('${app.id}')">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn btn-outline btn-icon" style="width:32px; height:32px; font-size:0.8rem; color:var(--accent); border-color:rgba(244,63,94,0.3)" onclick="window.deleteApp('${app.id}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        // --- Logic ---

        window.viewApp = (id) => {
            currentId = id;
            const app = allApplications.find(a => a.id === id);
            if(!app) return;

            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <div class="detail-item"><label>Full Name</label><p>${app.fullName}</p></div>
                <div class="detail-item"><label>Email</label><p>${app.email}</p></div>
                <div class="detail-item"><label>Phone</label><p>${app.phone || 'N/A'}</p></div>
                <div class="detail-item"><label>College</label><p>${app.college || 'N/A'}</p></div>
                <div class="detail-item"><label>Year</label><p>${app.year || 'N/A'}</p></div>
                <div class="detail-item"><label>Expertise</label><p>${app.expertise || 'N/A'}</p></div>
                <div class="detail-item full-width"><label>Experience</label><p>${app.experience || 'None'}</p></div>
                <div class="detail-item full-width"><label>Bio</label><p>${app.bio || 'None'}</p></div>
            `;
            
            modal.classList.add('active');
        };

        window.deleteApp = (id) => {
            if(confirm("Are you sure? This cannot be undone.")) {
                remove(ref(db, `writer-applications/${id}`))
                    .then(() => showToast('Application deleted', 'success'))
                    .catch(err => showToast(err.message, 'error'));
            }
        };

        function updateStatus(status) {
            if(!currentId) return;
            update(ref(db, `writer-applications/${currentId}`), { status: status })
                .then(() => {
                    showToast(`Marked as ${status}`, 'success');
                    modal.classList.remove('active');
                })
                .catch(err => showToast(err.message, 'error'));
        }

        // --- Utilities ---

        function updateStats() {
            document.getElementById('totalApplications').textContent = allApplications.length;
            document.getElementById('pendingApplications').textContent = allApplications.filter(a => !a.status || a.status === 'pending').length;
            document.getElementById('reviewedApplications').textContent = allApplications.filter(a => a.status === 'reviewed').length;
            document.getElementById('rejectedApplications').textContent = allApplications.filter(a => a.status === 'rejected').length;
        }

        function setLoading(state) {
            if(state) spinner.classList.add('active');
            else spinner.classList.remove('active');
        }

        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = type === 'error' ? 'var(--accent)' : (type === 'success' ? 'var(--success)' : 'var(--primary)');
            
            const icon = type === 'error' ? 'fa-exclamation-circle' : (type === 'success' ? 'fa-check-circle' : 'fa-info-circle');
            
            toast.innerHTML = `<i class="fas ${icon}"></i> <span>${msg}</span>`;
            document.getElementById('toastContainer').appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function switchView(mode) {
            const tableBtn = document.getElementById('viewTableBtn');
            const gridBtn = document.getElementById('viewGridBtn');
            const container = document.getElementById('dataContainer');

            if (mode === 'grid') {
                container.classList.remove('view-mode-table');
                container.classList.add('view-mode-grid');
                gridBtn.classList.add('active');
                tableBtn.classList.remove('active');
            } else {
                container.classList.remove('view-mode-grid');
                container.classList.add('view-mode-table');
                tableBtn.classList.add('active');
                gridBtn.classList.remove('active');
            }
        }

        // --- Event Listeners ---

        document.getElementById('refreshBtn').onclick = () => { init(); showToast('Data refreshed'); };
        document.getElementById('logoutBtn').onclick = () => { if(confirm('Logout?')) window.location.href='index.html'; };
        document.getElementById('closeModal').onclick = () => modal.classList.remove('active');
        
        document.getElementById('approveBtn').onclick = () => updateStatus('reviewed');
        document.getElementById('rejectBtn').onclick = () => updateStatus('rejected');
        document.getElementById('emailBtn').onclick = () => {
            const app = allApplications.find(a => a.id === currentId);
            if(app) window.open(`mailto:${app.email}?subject=Regarding Your Application`);
        };

        // Filter Events
        ['statusFilter', 'expertiseFilter', 'searchInput'].forEach(id => {
            document.getElementById(id).addEventListener('input', renderData);
        });

        // View Toggles
        document.getElementById('viewTableBtn').onclick = () => switchView('table');
        document.getElementById('viewGridBtn').onclick = () => switchView('grid');

        // Export (CSV Logic)
        document.getElementById('exportCSV').onclick = () => {
             const headers = ['Name', 'Email', 'Phone', 'College', 'Expertise', 'Status'];
             const rows = allApplications.map(a => 
                 [a.fullName, a.email, a.phone, a.college, a.expertise, a.status || 'pending'].map(f => `"${f || ''}"`).join(',')
             );
             const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows].join('\n');
             const link = document.createElement("a");
             link.href = encodeURI(csvContent);
             link.download = "applications.csv";
             link.click();
        };

        // Start
        init();
    </script>
</body>
</html>
